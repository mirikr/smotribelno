<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#110f16" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: окно на весь экран, шапка сама отступает под строку состояния (env(safe-area-inset-top)).
         С «black» iOS у приложения с главного экрана сдвигает окно вниз, а высоту не уменьшает — низ уходит за экран. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Смотрибельно" />
    <title>Смотрибельно</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/192.png" />
    <link rel="apple-touch-icon" href="icons/192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="./starhall.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-row">
        <button type="button" class="brand" data-view="home" aria-label="Главная"><span class="star">★</span> Смотрибельно</button>
        <button type="button" class="gear" data-view="data" aria-label="Настройки и данные"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 2.6h3.4l.5 2.6a7.4 7.4 0 0 1 1.9 1.1l2.5-.9 1.7 2.9-2 1.7a7.6 7.6 0 0 1 0 2.2l2 1.7-1.7 2.9-2.5-.9a7.4 7.4 0 0 1-1.9 1.1l-.5 2.6h-3.4l-.5-2.6a7.4 7.4 0 0 1-1.9-1.1l-2.5.9-1.7-2.9 2-1.7a7.6 7.6 0 0 1 0-2.2l-2-1.7 1.7-2.9 2.5.9a7.4 7.4 0 0 1 1.9-1.1z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <form class="link-form" id="link-form" autocomplete="off">
        <input id="link-input" type="url" inputmode="url" placeholder="Ссылка на видео YouTube" aria-label="Ссылка на видео YouTube" />
        <button type="button" class="paste-btn" id="paste-btn">Вставить</button>
        <button type="submit" aria-label="Открыть видео по ссылке">→</button>
      </form>
    </header>

    <!-- Потянуть список вниз — обновить -->
    <div class="ptr" id="ptr" aria-hidden="true"><span class="ptr-star">★</span></div>

    <main>
      <section id="view-home" class="view" aria-labelledby="h-home">
        <h1 id="h-home" class="visually-hidden">Главная</h1>
        <div id="home"></div>
      </section>
      <section id="view-later" class="view" aria-labelledby="h-later" hidden>
        <h1 id="h-later" class="visually-hidden">Смотреть позже+</h1>
        <div class="seg" id="later-seg" role="group" aria-label="Очередь или плейлисты"></div>
        <div id="later-list"></div>
        <div id="pl-view" hidden></div>
      </section>
      <section id="view-ratings" class="view" aria-labelledby="h-ratings" hidden>
        <h1 id="h-ratings" class="visually-hidden">Оценки</h1>
        <div class="seg seg-scroll" id="ratings-seg" role="group" aria-label="Какие видео показать"></div>
        <input id="ratings-search" class="search" type="search" placeholder="Поиск по названию и каналу" aria-label="Поиск по оценкам" />
        <div id="ratings-list"></div>
      </section>
      <section id="view-channels" class="view" aria-labelledby="h-channels" hidden>
        <h1 id="h-channels" class="visually-hidden">Каналы</h1>
        <div id="channels-box"></div>
      </section>
      <section id="view-stats" class="view" aria-labelledby="h-stats" hidden>
        <h1 id="h-stats" class="visually-hidden">Статистика</h1>
        <div id="stats-box"></div>
      </section>
      <section id="view-data" class="view" aria-labelledby="h-data" hidden>
        <h1 id="h-data" class="view-title">Настройки и данные</h1>
        <div id="data-box"></div>
      </section>
    </main>

    <div class="update-bar" id="update-bar" role="status" hidden>
      <span><b>Доступна новая версия</b><small>Смотрибельно обновится за секунду</small></span>
      <button type="button" id="update-btn">Обновить</button>
    </div>

    <nav class="tabbar" aria-label="Разделы">
      <!-- Значки — рисунки одного размера и толщины линий (символы шрифта на iPhone разного размера) -->
      <button type="button" data-view="home" class="on" aria-label="Главная"><span aria-hidden="true"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5a1 1 0 0 0 1 1h3.5v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg></span></button>
      <button type="button" data-view="later" aria-label="Смотреть позже+"><span aria-hidden="true"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span><b id="n-later"></b></button>
      <button type="button" data-view="ratings" aria-label="Оценки"><span aria-hidden="true"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></span><b id="n-ratings"></b></button>
      <button type="button" data-view="channels" aria-label="Каналы"><span aria-hidden="true"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="m10.5 10 4 2.5-4 2.5z" fill="currentColor"/><path d="M7 3.5h10"/></svg></span></button>
      <button type="button" data-view="stats" aria-label="Статистика"><span aria-hidden="true"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20.5h18" opacity=".45"/><path d="M3 15.5c2.6 0 3.4-7 6.6-7s3.6 5.5 6.6 5.5S19.8 7 21 4.5"/><path d="M3 18c2.4 0 3.8-3.5 6.4-3.5S13.6 17 16.4 17s3.4-2.5 4.6-3.5" opacity=".55"/></svg></span></button>
    </nav>

    <!-- Видео: смотреть, важность, оценка, момент, отзыв, «не досмотрел» -->
    <dialog id="sheet" class="sheet" aria-labelledby="sh-title">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div id="sheet-body"></div>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>

    <!-- Google Диск отключился: на весь экран, пока не войдут снова или не нажмут «Позже» -->
    <div class="relogin" id="relogin" role="alertdialog" aria-modal="true" aria-labelledby="relogin-t" aria-describedby="relogin-d" hidden>
      <div class="relogin-card">
        <div class="relogin-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4 4 0 0 1-.5 9.5H7z"/><path d="M10 12.5l4 4M14 12.5l-4 4"/></svg>
        </div>
        <h2 id="relogin-t">Google Диск отключился</h2>
        <p id="relogin-d">Google попросил войти снова. Пока вы не войдёте, оценки, список и плейлисты с телефона не попадут на компьютер, а с компьютера — сюда.</p>
        <div class="relogin-btns">
          <button type="button" class="btn primary" id="relogin-go">Войти в Google</button>
          <button type="button" class="btn" id="relogin-later">Позже</button>
        </div>
      </div>
    </div>

    <script src="./shared.js"></script>
    <script src="app.js"></script>
  </body>
</html>
